# Build the Debian/Ubuntu source and binary packages on every push
# to debian/latest, every PR targeting it, and every v* tag.  This
# does NOT publish to OBS — see debian/scripts/publish.sh and
# debian/README.OBS.  Its job is to catch packaging regressions
# before they reach the maintainer's laptop.
#
# Matrix is kept narrow on purpose: one container per target
# distribution, amd64 only.  OBS rebuilds the same matrix
# server-side (and adds arm64) once publish.sh runs; CI's value
# is fast feedback on the source-package shape, not full multi-arch
# coverage.

name: debian-package

on:
  push:
    branches: [debian/latest]
    tags: ['v*']
  pull_request:
    branches: [debian/latest]
  workflow_dispatch:

permissions:
  contents: write   # needed for the tag-release job below; build jobs
                    # don't read this scope.

jobs:
  build:
    name: ${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    # Per-cell continue-on-error: only the experimental cells
    # (ubuntu:devel -- a rolling, weekly-changing target) are
    # allowed to fail without gating the matrix.  Every other cell
    # is required.  Cells set matrix.target.experimental: true to
    # opt in; the rest leave it unset (falsy).
    continue-on-error: ${{ matrix.target.experimental == true }}
    container:
      image: ${{ matrix.target.image }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # The matrix covers three distributions (Debian trixie,
          # Debian sid, Ubuntu noble) on two architectures (amd64,
          # arm64), plus Ubuntu's rolling development release as a
          # non-gating forward-looking check.
          #
          # runner: ubuntu-latest hosts the amd64 cells;
          # ubuntu-24.04-arm hosts the arm64 cells.  The runner is
          # only the host VM -- the actual build environment is the
          # container named in image:, and debian:* / ubuntu:* are
          # multi-arch on Docker Hub, so the same image: value picks
          # the arch matching its host.
          #
          # ccache: true on the three amd64 cells.  GitHub's per-repo
          # cache budget is 10 GB; with CCACHE_MAXSIZE=3.3G that is
          # 3 x 3.3 = 9.9 GB.  The arm64 cells build cold.  ccache
          # produces byte-identical objects, so cached and cold
          # cells build exactly the same code.
          - { label: debian-trixie-amd64,  image: 'debian:trixie', runner: 'ubuntu-latest', ccache: true }
          - { label: debian-sid-amd64,     image: 'debian:sid',    runner: 'ubuntu-latest', ccache: true }
          - { label: ubuntu-noble-amd64,   image: 'ubuntu:24.04',  runner: 'ubuntu-latest', ccache: true }
          # ubuntu:devel is the current Ubuntu development release,
          # a rolling Docker Hub tag.  experimental: true so a
          # breakage on this moving target does not gate the matrix;
          # it is a forward-looking check that catches incompatibility
          # with the next Ubuntu before it ships.
          - { label: ubuntu-devel-amd64,   image: 'ubuntu:devel',  runner: 'ubuntu-latest', experimental: true }
          - { label: debian-trixie-arm64,  image: 'debian:trixie', runner: 'ubuntu-24.04-arm' }
          - { label: debian-sid-arm64,     image: 'debian:sid',    runner: 'ubuntu-24.04-arm' }
          - { label: ubuntu-noble-arm64,   image: 'ubuntu:24.04',  runner: 'ubuntu-24.04-arm' }
          - { label: ubuntu-devel-arm64,   image: 'ubuntu:devel',  runner: 'ubuntu-24.04-arm', experimental: true }
          #
          # Architectures beyond amd64/arm64 (riscv64, ppc64el,
          # s390x) are not built here: GitHub-hosted runners exist
          # only for amd64 and arm64.  Debian's archive autobuilders
          # have native hardware for the other architectures and
          # rebuild the package from the source package, so CI
          # proving amd64 + arm64 is sufficient.

    steps:
      - name: Free up runner disk space
        # GitHub-hosted ubuntu-latest gives a job only ~14 GB free on
        # the root filesystem.  The DuckDB build with DISABLE_UNITY=ON
        # produces thousands of debuggable .o files plus libduckdb.so,
        # libduckdb_static.a and the in-tree extensions -- enough to
        # exhaust that budget (ar failed with "No space left on device"
        # assembling libduckdb_static.a in run 26118982837).
        #
        # This job runs inside a distro container, so the usual
        # host-side cleanup actions (jlumbroso/free-disk-space) cannot
        # reach the host's toolcache paths -- the container only sees
        # the bind mounts GitHub sets up.  /opt/hostedtoolcache *is*
        # bind-mounted (as /__t), and holds ~8 GB of CPython/Node/Go/
        # Ruby toolchains this build never uses.  Emptying it from
        # inside the container reclaims real space on the same volume
        # the build writes to.  The mount point itself is left intact
        # so nothing downstream trips over a missing directory.
        run: rm -rf /__t/* 2>/dev/null || true

      - name: Install build prerequisites
        # apt-get is run before the checkout so `git` is available
        # for actions/checkout and dpkg-parsechangelog inside debian/rules.
        # ccache is installed on every cell (it is a tiny package);
        # it is only *used* on cells with matrix.target.ccache, gated
        # via the DEB_DUCKDB_CCACHE env var on the build step below.
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential ca-certificates ccache devscripts \
              dpkg-dev equivs fakeroot git lintian quilt

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # dpkg-parsechangelog and git rev-parse need history

      - name: Mark workspace as a safe git directory
        # actions/checkout's owner uid mismatch with the container's
        # root user trips git's "dubious ownership" check.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore ccache
        # Only the cells with matrix.target.ccache use the compile
        # cache (GitHub's 10 GB per-repo cache budget only stretches
        # to two ~3-4 GB caches -- see the matrix comment).
        #
        # CCACHE_DIR is placed inside GITHUB_WORKSPACE so the cache,
        # restored by this host-side action, is visible to the
        # compiler running inside the container (the workspace is
        # bind-mounted; arbitrary host paths are not).
        #
        # key embeds the matrix label so trixie and noble keep
        # separate caches (their toolchains differ; objects are not
        # interchangeable).  github.sha makes each run write a fresh
        # entry; restore-keys falls back to the most recent cache
        # for the same cell so warm builds survive across commits.
        if: ${{ matrix.target.ccache }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target.label }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target.label }}-

      - name: Install package Build-Depends
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          mk-build-deps --install --remove --tool='apt-get -y --no-install-recommends' debian/control

      - name: Build source + binary packages
        # DEB_DUCKDB_CCACHE / CCACHE_* are only set on cells where
        # matrix.target.ccache is true; on the other five cells the
        # env vars are empty and debian/rules builds cold.
        env:
          DEB_DUCKDB_CCACHE: ${{ matrix.target.ccache && '1' || '' }}
          CCACHE_DIR: ${{ matrix.target.ccache && format('{0}/.ccache', github.workspace) || '' }}
          # 3.3 GB ceiling: three cached cells x 3.3 GB = 9.9 GB,
          # right at the 10 GB per-repo cache budget.  actions/cache
          # evicts least-recently-used entries if the repo total is
          # exceeded, so a brief overshoot self-corrects.
          CCACHE_MAXSIZE: 3.3G
        run: |
          set -eu
          # -us -uc: don't sign source or changes.  CI has no key by
          # design; signing is part of publishing, not building.
          # -b: binary-only on this leg; the source package is built
          # in the dedicated job below for upload as a release asset.
          if [ -n "${DEB_DUCKDB_CCACHE:-}" ]; then
              echo "=== ccache enabled; pre-build stats ==="
              ccache --zero-stats >/dev/null
              ccache --show-stats --verbose | head -20 || true
          fi
          dpkg-buildpackage -us -uc -b
          if [ -n "${DEB_DUCKDB_CCACHE:-}" ]; then
              echo "=== ccache post-build stats ==="
              ccache --show-stats --verbose | head -20 || true
          fi

      - name: Stage build outputs into workspace
        # dpkg-buildpackage writes .deb/.changes/.buildinfo to the
        # parent of the source tree, which sits *outside* the
        # GitHub workspace.  upload-artifact@v4 refuses paths
        # outside the workspace, so move them in before upload.
        #
        # *.ddeb is included because Ubuntu's debhelper renames
        # debug-symbol packages from .deb to .ddeb (a convention
        # used by Ubuntu's archive to keep debug packages out of
        # main; Debian does not do this).  The .changes file
        # references the .ddeb filename verbatim, so lintian's
        # walk over the .changes will error with "does not exist,
        # exiting" if the .ddeb is left in ../.  Including *.ddeb
        # in the glob keeps the staging step uniform across
        # Debian (no .ddeb produced -> glob expands to nothing
        # via nullglob below) and Ubuntu.
        run: |
          set -eu
          shopt -s nullglob 2>/dev/null || true
          mkdir -p artefacts
          # `mv` of a non-matching glob would fail under set -eu
          # without nullglob; the conditional invocation below
          # works on both bash (with nullglob) and POSIX sh.
          for f in ../*.deb ../*.ddeb ../*.changes ../*.buildinfo; do
              [ -e "$f" ] && mv "$f" artefacts/
          done

      - name: Run lintian (strict)
        # Uses debian/scripts/lintian-local.sh so the CI invocation
        # is identical to what a maintainer runs locally.  The
        # script gates on error+warning severity with a documented
        # suppression list (see the script header for the
        # justification for each suppressed tag).  Failing here
        # means a real packaging issue, not noise.
        run: debian/scripts/lintian-local.sh

      - name: Upload built .deb files
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.target.label }}
          path: |
            artefacts/*.deb
            artefacts/*.ddeb
            artefacts/*.changes
            artefacts/*.buildinfo
          # Default retention is 90 days; tagged builds are also
          # promoted to a GH release below, which has no expiry.
          retention-days: 30

  source-package:
    # Build the .dsc + orig tarball once, on the newest Debian, for
    # release upload.  OBS re-derives these from git, so this job
    # exists only to give humans a single download of "the source
    # this tag corresponds to."
    name: source-package
    runs-on: ubuntu-latest
    container:
      image: 'debian:sid'
    steps:
      - name: Install prerequisites
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates devscripts dpkg-dev fakeroot git

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Build-Depends-Indep
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends equivs
          mk-build-deps --install --remove --tool='apt-get -y --no-install-recommends' debian/control

      - name: Generate orig tarball
        # 3.0 (quilt) source format requires <pkg>_<upstream-version>.orig.tar.*
        # in the parent directory; the .dsc references it by SHA256.  For
        # snapshot builds (where there is no upstream release tarball to
        # download) we synthesise one with git archive, excluding the
        # packaging tree and any local/scratch files so the orig matches
        # what `dpkg-source -b` expects: pristine upstream sources only.
        #
        # The version with the "-N" Debian revision stripped is what
        # dpkg-source looks for; dpkg-parsechangelog -S Version gives the
        # full version, we drop the trailing "-N" to get upstream-only.
        run: |
          set -eu
          upstream_version=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          orig_name="duckdb_${upstream_version}.orig.tar.xz"
          echo "Building $orig_name from HEAD (excluding debian/, .git/, scratch)"
          # git archive HEAD respects .gitattributes export-ignore; we do
          # not currently use those, so prune debian/ explicitly via tar.
          git archive --format=tar HEAD \
              | tar --delete debian \
              | xz -T0 > "../$orig_name"
          ls -lh "../$orig_name"

      - name: Build source package
        # -d skips the build-dep check (mk-build-deps already installed
        # them).  -S says source-only.  The orig tarball generated above
        # is what dpkg-source -b looks for.
        run: dpkg-buildpackage -us -uc -S -d

      - name: Stage source package into workspace
        run: |
          set -eu
          mkdir -p artefacts
          mv ../*.dsc ../*.tar.* ../*_source.changes artefacts/

      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: |
            artefacts/*.dsc
            artefacts/*.tar.*
            artefacts/*_source.changes
          retention-days: 30

  autopkgtest:
    # Run debian/tests/ against the freshly built .deb files on a
    # clean container of each target distribution.  This catches
    # packaging defects that the build job cannot see: missing
    # Depends, wrong shlibs, missing files in the binary packages,
    # ABI breakage between libduckdb1 and libduckdb-dev's headers,
    # rpath problems, etc.
    #
    # The same debian/tests/control + scripts are what a Debian
    # mentors reviewer will run with `autopkgtest` on their own
    # machine, so passing here is a real readiness signal.
    name: autopkgtest-${{ matrix.target.label }}
    runs-on: ${{ matrix.target.runner }}
    needs: [build]
    # Same per-cell rule as the build job: the ubuntu:devel cells
    # are experimental and do not gate the matrix.
    continue-on-error: ${{ matrix.target.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Mirror the build job's matrix so each (distro, arch)
          # combination has its packages installed and tested on a
          # runner of the same architecture.  Cross-arch autopkgtest
          # would require QEMU and a different runner setup; for
          # arm64 we have native runners and don't need that.
          - { label: debian-trixie-amd64,  image: 'debian:trixie', runner: 'ubuntu-latest' }
          - { label: debian-sid-amd64,     image: 'debian:sid',    runner: 'ubuntu-latest' }
          - { label: ubuntu-noble-amd64,   image: 'ubuntu:24.04',  runner: 'ubuntu-latest' }
          - { label: ubuntu-devel-amd64,   image: 'ubuntu:devel',  runner: 'ubuntu-latest', experimental: true }
          - { label: debian-trixie-arm64,  image: 'debian:trixie', runner: 'ubuntu-24.04-arm' }
          - { label: debian-sid-arm64,     image: 'debian:sid',    runner: 'ubuntu-24.04-arm' }
          - { label: ubuntu-noble-arm64,   image: 'ubuntu:24.04',  runner: 'ubuntu-24.04-arm' }
          - { label: ubuntu-devel-arm64,   image: 'ubuntu:devel',  runner: 'ubuntu-24.04-arm', experimental: true }
    container:
      image: ${{ matrix.target.image }}
    steps:
      - name: Install autopkgtest + git
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              autopkgtest ca-certificates git

      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download .deb artefacts for this distro
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.target.label }}
          path: artefacts

      - name: Run autopkgtest
        # `--no-built-binaries` together with explicit .deb paths
        # tells autopkgtest to install the packages we just built,
        # not to rebuild from source.  `null` runner means
        # "current container" — we're already inside the target
        # distro's container, so no second-level isolation is
        # needed (and would not work without privileged mode).
        # `--shell-fail` opens a debug shell if running locally;
        # in CI it has no effect because there is no terminal.
        # Exit code 0 = all tests passed; 2 = some tests were
        # skipped (skippable restriction); 4 = a real failure.
        run: |
          set -eu
          # *.ddeb handles Ubuntu's debug-symbol filename convention
          # (Debian-built .changes won't reference .ddeb so the glob
          # expanding to literal '../*.ddeb' on Debian is fine --
          # autopkgtest ignores nonexistent positional arguments).
          # Use a for-loop to silently skip the empty glob case.
          set -- artefacts/*.changes
          for f in artefacts/*.deb artefacts/*.ddeb; do
              [ -e "$f" ] && set -- "$@" "$f"
          done
          autopkgtest "$@" --output-dir=autopkgtest-out -- null

      - name: Upload autopkgtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopkgtest-logs-${{ matrix.target.label }}
          path: autopkgtest-out
          retention-days: 14

  release:
    # On v* tags only: gather all matrix artefacts and attach them
    # to a GitHub Release so they outlive the 30-day artifact
    # retention window.  Releases are kept indefinitely.
    name: promote-to-github-release
    needs: [build, source-package, autopkgtest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          tag=${GITHUB_REF#refs/tags/}
          # Idempotent: create the release if missing, otherwise
          # just upload the new assets to the existing one.
          # `--clobber` overwrites assets with the same filename,
          # so re-runs of the workflow on the same tag succeed.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              gh release upload "$tag" release-assets/* \
                  --repo "$REPO" --clobber
          else
              gh release create "$tag" release-assets/* \
                  --repo "$REPO" \
                  --title "$tag" \
                  --notes "Automated build artefacts for $tag.  See debian/README.distribution for installation instructions."
          fi
